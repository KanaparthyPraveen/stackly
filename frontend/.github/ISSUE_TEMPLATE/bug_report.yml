name: Bug report
description: Something isn't working as expected
title: "fix: <short summary>"
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: plane
    attributes:
      label: Plane work item
      placeholder: STACKRYZE-<id>
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: OS, browser, Node version, commit SHA
